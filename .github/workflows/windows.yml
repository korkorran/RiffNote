# Builds the Windows installer and publishes it to the GitHub release.
#
# Pushing to the releases branch is what publishes. Nothing else starts this
# workflow: not a push to main, not a pull request, not a tag on its own. The
# commit pushed to releases must carry a tag, and that tag names the release —
# the run fails outright if no tag points at it, rather than publish a version
# number that does not match its contents. Pushing the same tag again replaces
# that release's files.
#
# One of three package workflows, alongside deb.yml and rpm.yml. They publish
# independently: each attaches its own file to the release as soon as it is
# ready, so a build broken on one platform no longer holds up the other two.
# The price is that a release can be incomplete with nothing saying so — check
# that all three ran green before announcing a version.
#
# Their release jobs share one concurrency group. A concurrency group is
# repository-wide rather than workflow-scoped, so naming the same group in all
# three serialises them: the first to arrive creates the release, the others
# add their asset to it. Without that they would race to create it and the
# losers would fail with a 422.

name: Windows installer

on:
  # Nothing else starts these: pushing to releases is the act of publishing.
  push:
    branches: [releases]

concurrency:
  # Never cancel-in-progress here: every run publishes, and killing one
  # mid-upload would leave the release half-populated.
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Build installer (x64)
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the version step needs to know whether a tag
          # points at this exact commit, which a shallow clone cannot answer.
          fetch-depth: 0

      - name: Work out the version from the tag
        id: version
        shell: bash
        run: |
          # The release is named after the tag on this very commit — not the
          # nearest reachable one. A release labelled 0.1.0 but built from a
          # commit that is not 0.1.0 cannot be taken back once people have
          # downloaded it, so an inexact match stops the run instead.
          if ! tag="$(git describe --exact-match --tags HEAD 2>/dev/null)"; then
            echo "::error::No tag points at $(git rev-parse --short HEAD). Tag the commit you want to publish and push the tag (git push origin <tag>) before pushing it to releases."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag as version ${tag#v}"

      - name: Install Inno Setup
        # upgrade rather than install: the runner image ships an Inno Setup of
        # its own, and make-installer.ps1 needs 6.3 or later for
        # ArchitecturesAllowed=x64compatible.
        run: |
          # Chocolatey reaches its own CDN; a blip there should not fail a
          # publish. Same reasoning for every network step in this workflow.
          foreach ($i in 1..3) {
            choco upgrade innosetup -y --no-progress
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 3) { throw "choco failed after 3 attempts" }
            Write-Host "::warning::choco attempt $i of 3 failed"
            Start-Sleep -Seconds 30
          }

      - name: Fetch the WebView2 SDK headers
        # owebview's discover.ml needs WebView2.h at build time, and owebview
        # is a dependency — so this has to happen before `opam install`, not
        # before the packaging script. Setting MICROSOFT_WEB_WEBVIEW2 is more
        # predictable than the NuGet-cache search discover.ml falls back to:
        # `nuget install` unpacks into the working directory, not the cache.
        run: |
          $nuget = Get-Command nuget -ErrorAction SilentlyContinue
          if ($nuget) {
            $nugetExe = $nuget.Source
          } else {
            $nugetExe = "$env:RUNNER_TEMP\nuget.exe"
            $url = 'https://dist.nuget.org/win-x86-commandline/latest/nuget.exe'
            Invoke-WebRequest $url -OutFile $nugetExe -MaximumRetryCount 3 -RetryIntervalSec 10
          }
          foreach ($i in 1..3) {
            & $nugetExe install Microsoft.Web.WebView2 -OutputDirectory "$env:RUNNER_TEMP\nuget" -ExcludeVersion
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 3) { throw "nuget failed after 3 attempts" }
            Write-Host "::warning::nuget attempt $i of 3 failed"
            Start-Sleep -Seconds 30
          }
          $pkg = "$env:RUNNER_TEMP\nuget\Microsoft.Web.WebView2"
          if (-not (Test-Path "$pkg\build\native\include\WebView2.h")) {
            throw "WebView2.h is not under $pkg — the NuGet layout changed"
          }
          "MICROSOFT_WEB_WEBVIEW2=$pkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5'
          dune-cache: true

      - name: Prefer the opam archive mirror
        run: |
          # menhir — and only menhir — is fetched from gitlab.inria.fr, a single
          # institutional server rather than a CDN, and that host times out from
          # GitHub's runners while answering instantly from elsewhere. It is the
          # one host in this dependency tree that is not github.com or
          # erratique.ch, and it is what has failed every run so far.
          #
          # opam's repository ships an `archive-mirrors: "cache"` pointing at
          # opam.ocaml.org/cache, which holds a byte-identical copy of every
          # archive — but that is a path relative to the repository URL, and CI
          # uses the *git* repository (git+https://github.com/ocaml/
          # opam-repository.git), where it does not resolve. Naming the mirror
          # outright restores it, for every package rather than just menhir.
          opam option --global 'archive-mirrors=["https://opam.ocaml.org/cache"]'
          opam option --global archive-mirrors

      - name: Install the OCaml dependencies
        run: |
          # opam fetches from a dozen different third-party hosts and only needs
          # one to be slow — this is the step that timed out on gitlab.inria.fr
          # fetching menhir. Retrying is worth it because the work is resumable:
          # packages already installed stay installed, so a second attempt picks
          # up where the first stopped rather than starting over.
          foreach ($i in 1..3) {
            opam install . --deps-only --yes
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 3) { throw "opam install failed after 3 attempts" }
            Write-Host "::warning::opam attempt $i of 3 failed"
            Start-Sleep -Seconds 30
          }

      - name: Build the installer
        run: opam exec -- pwsh -File .\packaging\make-installer.ps1 -Release -Version '${{ steps.version.outputs.version }}'

      - uses: actions/upload-artifact@v4
        with:
          name: sun-notes-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

  verify-windows:
    name: Install on windows-latest
    needs: build-windows
    runs-on: windows-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sun-notes-windows-x64
          path: dist

      - name: Install it silently
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          # /DIR pins the location: with PrivilegesRequired=lowest the default
          # is under the user's profile, and the checks below should not have
          # to guess which.
          $innoArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
                        '/DIR=C:\sun-notes-test', '/LOG=C:\install.log')
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList $innoArgs
          if ($p.ExitCode -ne 0) {
            Get-Content C:\install.log -Tail 60
            throw "the installer exited with $($p.ExitCode)"
          }

      - name: Check what was installed
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'C:\sun-notes-test'
          foreach ($f in @("$app\sun-notes.exe", "$app\web\index.html",
                           "$app\web\app.js", "$app\unins000.exe")) {
            if (-not (Test-Path $f)) { throw "missing from the install: $f" }
          }
          # No OCaml sources should have come along for the ride.
          $ml = Get-ChildItem "$app\web" -Include *.ml,*.mli -Recurse -ErrorAction SilentlyContinue
          if ($ml) { throw "OCaml sources were shipped: $($ml.Name -join ', ')" }
          Get-ChildItem $app -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize

      # A hard gate, and the one that 0.1.0 needed. This runner has the mingw
      # toolchain on its PATH, so the app started here perfectly well while
      # the published installer was missing libgcc_s_seh-1.dll and died on
      # every user's machine. Stripping PATH back to the system directories
      # leaves Windows able to resolve DLLs only from the install directory
      # itself — which is exactly the situation on a clean machine.
      - name: Check the app runs with nothing but itself on PATH
        run: |
          $ErrorActionPreference = 'Stop'
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          $p = Start-Process 'C:\sun-notes-test\sun-notes.exe' -PassThru -RedirectStandardOutput C:\out.txt -RedirectStandardError C:\err.txt
          Start-Sleep -Seconds 20
          if (-not $p.HasExited) { $p.Kill() }
          Get-Content C:\out.txt, C:\err.txt -ErrorAction SilentlyContinue
          # main.ml prints the webview version before it creates any window, so
          # reaching that line means every DLL resolved. Whether the window
          # then opens is a separate question, checked separately below.
          if (-not (Select-String -Path C:\out.txt -Pattern 'using webview' -Quiet)) {
            throw "the app never got as far as printing its webview version: a DLL it needs is missing from the install"
          }

      # Advisory, for the same reason as on the two Linux sides: whether a GUI
      # can be created at all on a runner with no interactive desktop session
      # is not something the package controls. Reads the output captured by the
      # step above rather than launching again.
      - name: Smoke-test the window
        continue-on-error: true
        run: |
          if (-not (Select-String -Path C:\out.txt -Pattern 'native window handle' -Quiet)) {
            throw "the window handle never appeared — WebView2 or the desktop session, not the payload"
          }

  # ----------------------------------------------------------------- release

  release:
    name: Attach to the release
    needs: [build-windows, verify-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with the other two package workflows — see the note at the top.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sun-notes-windows-x64
          path: dist

      - name: List what will be uploaded
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          # On a branch push github.ref is refs/heads/releases, which is not a
          # tag, so the action would have nothing to attach to. The tag comes
          # from the build job — the one that has the repository checked out.
          tag_name: ${{ needs.build-windows.outputs.tag }}
          files: dist/*.exe
          fail_on_unmatched_files: true
          # Pushing the same tag to releases again replaces that release's files.
          overwrite_files: true
