# Builds every downloadable package and, on a tag, attaches them to the release.
#
# Three packages, three build hosts, one release job: the .deb has to be built
# on Debian-family userland, the .rpm on Fedora and the Windows installer on
# Windows, but all of them must land on the same GitHub release, so they
# converge on a single `release` job at the end. Separate workflows would mean
# several gh-release calls racing for the same tag.
#
# The macOS image is the one that is still built by hand — see packaging/.
#
# The .deb is built on ubuntu-22.04 on purpose, and the choice is not
# arbitrary: owebview needs webkit2gtk-4.1, which first appears in Debian 12
# and Ubuntu 22.04, and among those 22.04 is the one with the oldest glibc
# (2.35). Since dpkg-shlibdeps derives the libc6 floor from whatever the binary
# was linked against, building there gives the widest set of distributions the
# package can install on. Building on a newer runner would silently narrow it.
#
# If that runner image is ever retired, the replacement is
# `runs-on: ubuntu-latest` with `container: ubuntu:22.04`, which keeps the same
# glibc floor.

name: Packages

on:
  push:
    branches: [main]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    paths:
      - 'packaging/**'
      - 'run/**'
      - 'dune-project'
      - '.github/workflows/packages.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (defaults to the nearest tag)'
        required: false
        type: string

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ Debian

  build-deb:
    name: Build .deb (amd64)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          # make-deb.sh falls back to `git describe --tags` for the version,
          # which needs the tags to have been fetched.
          fetch-depth: 0

      - name: Work out the version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # An untagged build still has to produce a valid Debian version.
            # Appending the commit date and short sha keeps successive
            # snapshots ordered, and keeps them sorting *below* the release
            # that follows (~ sorts before everything, including the empty
            # string).
            base="$(git describe --tags --abbrev=0 2>/dev/null || echo 0.1.0)"
            version="${base#v}~git$(git show -s --format=%cd --date=format:%Y%m%d)+$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Install the packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev fakeroot lintian desktop-file-utils imagemagick binutils

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5'
          dune-cache: true

      # opam installs the native dependencies itself: owebview declares
      # libgtk-3-dev and libwebkit2gtk-4.1-dev as depexts for Debian-family
      # systems, and opam 2.1+ acts on them.
      - name: Install the OCaml dependencies
        run: opam install . --deps-only --yes

      - name: Build the package
        run: opam exec -- ./packaging/make-deb.sh --release --version '${{ steps.version.outputs.version }}'

      - uses: actions/upload-artifact@v4
        with:
          name: sun-notes-deb-amd64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

  verify-deb:
    name: Install .deb on ${{ matrix.runner }}
    needs: build-deb
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # The two distributions the package claims to support. This is the
        # step that actually proves the Depends are satisfiable there, rather
        # than merely well-formed.
        runner: [ubuntu-22.04, ubuntu-24.04]

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sun-notes-deb-amd64
          path: dist

      - name: Install it
        run: |
          sudo apt-get update
          # desktop-file-utils is for the check below; it is not a dependency
          # of the package, which is why it has to be asked for here.
          sudo apt-get install -y desktop-file-utils
          sudo apt-get install -y ./dist/sun-notes_*.deb

      - name: Check what was installed
        run: |
          set -euxo pipefail
          # dpkg -V re-checks every file against the md5sums in the package.
          sudo dpkg -V sun-notes
          command -v sun-notes
          # The launcher is a symlink into /usr/lib; if it resolves to nothing
          # the app does not start at all.
          test -x "$(readlink -f /usr/bin/sun-notes)"
          test -f /usr/lib/sun-notes/web/index.html
          test -f /usr/lib/sun-notes/web/app.js
          # No OCaml sources should have come along for the ride.
          ! find /usr/lib/sun-notes/web -name '*.ml' | grep . || exit 1
          desktop-file-validate /usr/share/applications/sun-notes.desktop
          # Nothing unresolved: this is what a missing or mis-declared
          # dependency would look like at runtime.
          ldd /usr/lib/sun-notes/sun-notes
          ! ldd /usr/lib/sun-notes/sun-notes | grep 'not found'

      # Advisory. Launching WebKitGTK under a virtual display is the one check
      # here that depends on the runner's graphics stack, so a failure is not
      # necessarily the package's fault; the install checks above are the
      # gates. Flip continue-on-error off if it proves reliable.
      - name: Smoke-test the window
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends xvfb dbus-x11
          # The window handle is printed by main.ml *after* Webview.create, so
          # seeing it means GTK and WebKit really did come up. The process then
          # runs its event loop until the timeout kills it, hence exit 124.
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          out=$(xvfb-run -a dbus-run-session -- timeout 20 sun-notes 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'native window handle'

  # ------------------------------------------------------------------ Fedora

  build-rpm:
    name: Build .rpm (x86_64)
    runs-on: ubuntu-latest
    env:
      SWITCH: sun-notes
    container:
      # Not pinned to an older release the way the .deb build is. Fedora's
      # support window is about thirteen months, so its users are on a recent
      # release anyway, and the images for end-of-life releases point at
      # mirrors that have moved to the archive — pinning one would trade a
      # small gain in glibc reach for a build that breaks on its own schedule.
      # Whatever is used here becomes the oldest Fedora the RPM installs on,
      # so pin a number (fedora:43, say) if you ever need to reach further
      # back, and pin the verify job below to the same one.
      image: fedora:latest

    steps:
      # Before the checkout, so that actions/checkout finds a real git and
      # fetches the tags rather than falling back to a tarball download.
      - name: Install the build and packaging tools
        run: |
          dnf -y install --setopt=install_weak_deps=False \
            git tar gzip findutils diffutils which \
            opam gcc gcc-c++ make patch unzip bzip2 \
            rpm-build rpmlint desktop-file-utils libappstream-glib ImageMagick \
            gtk3-devel webkit2gtk4.1-devel pkgconf-pkg-config

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Let git trust the checkout
        # The container runs as root over files the runner created, which git
        # refuses to touch without this.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Work out the version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            # An RPM version may not contain a hyphen, which separates it from
            # the release, so the snapshot suffix uses dots and a tilde. The
            # tilde sorts before everything, keeping snapshots below the
            # release that follows.
            base="$(git describe --tags --abbrev=0 2>/dev/null || echo 0.1.0)"
            version="${base#v}~git$(git show -s --format=%cd --date=format:%Y%m%d).$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      # The switch is a named one inside ~/.opam rather than a local ./_opam,
      # precisely so that this cache covers it: a local switch would sit in the
      # workspace, outside the cached path, and the compiler would be rebuilt
      # on every run.
      - name: Cache the opam root
        uses: actions/cache@v4
        with:
          path: ~/.opam
          key: opam-fedora-${{ hashFiles('dune-project', 'sun-notes.opam') }}
          restore-keys: opam-fedora-

      - name: Set up opam and the OCaml dependencies
        env:
          OPAMROOTISOK: '1'   # the container is root; opam asks to be told so
          OPAMYES: '1'
        run: |
          set -eux
          # Sandboxing uses bubblewrap, which needs privileges a container does
          # not have. The container is the sandbox here.
          if [ ! -d "$HOME/.opam" ]; then
            opam init --bare --disable-sandboxing
          fi
          # A compiler opam builds for itself, not Fedora's ocaml-system.
          # Fedora splits the compiler across several RPMs, and compiler-libs
          # — Toploop, Topdirs, compiler-libs.bytecomp — is one of the pieces
          # left out: against ocaml-system, ocamlfind, stdlib-shims and
          # ocaml-compiler-libs all fail to build for want of exactly those
          # modules. Installing the missing RPM would fix this instance;
          # building the compiler removes the whole class of mismatch, and
          # costs a few minutes only when the cache is cold.
          if ! opam switch list --short | grep -qx "$SWITCH"; then
            opam switch create "$SWITCH" ocaml-base-compiler
          fi
          eval "$(opam env --switch="$SWITCH" --set-switch)"
          opam install . --deps-only

      - name: Build the package
        env:
          OPAMROOTISOK: '1'
        run: |
          set -eux
          eval "$(opam env --switch="$SWITCH" --set-switch)"
          ./packaging/make-rpm.sh --release --version '${{ steps.version.outputs.version }}'

      - uses: actions/upload-artifact@v4
        with:
          name: sun-notes-rpm-x86_64
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 14

  verify-rpm:
    name: Install .rpm on Fedora
    needs: build-rpm
    runs-on: ubuntu-latest
    container:
      # Deliberately a clean image: the build container has every -devel
      # package installed, so it would satisfy the runtime requirements by
      # accident. This one only has what the RPM itself asks dnf for.
      image: fedora:latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sun-notes-rpm-x86_64
          path: dist

      - name: Install it
        run: |
          # desktop-file-utils and libappstream-glib are for the checks below,
          # not dependencies of the package.
          dnf -y install findutils desktop-file-utils libappstream-glib
          dnf -y install ./dist/sun-notes-*.rpm

      - name: Check what was installed
        run: |
          set -euxo pipefail
          # rpm -V re-checks every installed file against the package's digests.
          rpm -V sun-notes
          command -v sun-notes
          # The launcher is a relative symlink into /usr/libexec. If it
          # resolves to nothing, the app does not start and web_dir () would
          # not find the page either.
          test -x "$(readlink -f /usr/bin/sun-notes)"
          test -f /usr/libexec/sun-notes/web/index.html
          test -f /usr/libexec/sun-notes/web/app.js
          # No OCaml sources should have come along for the ride.
          ! find /usr/libexec/sun-notes/web -name '*.ml' | grep . || exit 1
          desktop-file-validate /usr/share/applications/sun-notes.desktop
          # GNOME Software reads this; if it is malformed the app is invisible
          # there even though it installed correctly.
          appstream-util validate-relax --nonet \
            /usr/share/metainfo/io.github.korkorran.sun-notes.metainfo.xml
          # The automatic dependency generator is the whole reason for using
          # RPM's machinery rather than naming packages by hand, so check it
          # actually produced the webkit requirement.
          rpm -q --requires sun-notes | grep 'libwebkit2gtk-4\.1'
          ldd /usr/libexec/sun-notes/sun-notes
          ! ldd /usr/libexec/sun-notes/sun-notes | grep 'not found'

      # Advisory, for the same reason as on the Debian side.
      - name: Smoke-test the window
        continue-on-error: true
        run: |
          dnf -y install xorg-x11-server-Xvfb dbus-x11
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          out=$(xvfb-run -a dbus-run-session -- timeout 20 sun-notes 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'native window handle'

  # ----------------------------------------------------------------- Windows

  build-windows:
    name: Build installer (x64)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the version
        shell: bash
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            base="$(git describe --tags --abbrev=0 2>/dev/null || echo 0.1.0)"
            version="${base#v}~git$(git show -s --format=%cd --date=format:%Y%m%d).$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building version $version"

      - name: Install Inno Setup
        # upgrade rather than install: the runner image ships an Inno Setup of
        # its own, and make-installer.ps1 needs 6.3 or later for
        # ArchitecturesAllowed=x64compatible.
        run: choco upgrade innosetup -y --no-progress

      - name: Fetch the WebView2 SDK headers
        # owebview's discover.ml needs WebView2.h at build time, and owebview
        # is a dependency — so this has to happen before `opam install`, not
        # before the packaging script. Setting MICROSOFT_WEB_WEBVIEW2 is more
        # predictable than the NuGet-cache search discover.ml falls back to:
        # `nuget install` unpacks into the working directory, not the cache.
        run: |
          $nuget = Get-Command nuget -ErrorAction SilentlyContinue
          if ($nuget) {
            $nugetExe = $nuget.Source
          } else {
            $nugetExe = "$env:RUNNER_TEMP\nuget.exe"
            Invoke-WebRequest https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile $nugetExe
          }
          & $nugetExe install Microsoft.Web.WebView2 -OutputDirectory "$env:RUNNER_TEMP\nuget" -ExcludeVersion
          $pkg = "$env:RUNNER_TEMP\nuget\Microsoft.Web.WebView2"
          if (-not (Test-Path "$pkg\build\native\include\WebView2.h")) {
            throw "WebView2.h is not under $pkg — the NuGet layout changed"
          }
          "MICROSOFT_WEB_WEBVIEW2=$pkg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5'
          dune-cache: true

      - name: Install the OCaml dependencies
        run: opam install . --deps-only --yes

      - name: Build the installer
        run: opam exec -- pwsh -File .\packaging\make-installer.ps1 -Release -Version '${{ steps.version.outputs.version }}'

      - uses: actions/upload-artifact@v4
        with:
          name: sun-notes-windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14

  verify-windows:
    name: Install on windows-latest
    needs: build-windows
    runs-on: windows-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sun-notes-windows-x64
          path: dist

      - name: Install it silently
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName
          # /DIR pins the location: with PrivilegesRequired=lowest the default
          # is under the user's profile, and the checks below should not have
          # to guess which.
          $innoArgs = @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
                        '/DIR=C:\sun-notes-test', '/LOG=C:\install.log')
          $p = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList $innoArgs
          if ($p.ExitCode -ne 0) {
            Get-Content C:\install.log -Tail 60
            throw "the installer exited with $($p.ExitCode)"
          }

      - name: Check what was installed
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'C:\sun-notes-test'
          foreach ($f in @("$app\sun-notes.exe", "$app\web\index.html",
                           "$app\web\app.js", "$app\unins000.exe")) {
            if (-not (Test-Path $f)) { throw "missing from the install: $f" }
          }
          # No OCaml sources should have come along for the ride.
          $ml = Get-ChildItem "$app\web" -Include *.ml,*.mli -Recurse -ErrorAction SilentlyContinue
          if ($ml) { throw "OCaml sources were shipped: $($ml.Name -join ', ')" }
          Get-ChildItem $app -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize

      # Advisory, for the same reason as on the two Linux sides: whether a GUI
      # can be created at all on a runner with no interactive desktop session
      # is not something the package controls. main.ml prints the native
      # window handle after Webview.create, so seeing it means WebView2 came
      # up.
      #
      # Note what this does NOT prove. This runner has the mingw runtime on
      # its PATH, so the app would start here even if the installer had left
      # libstdc++-6.dll out. Completeness of the payload is established at
      # build time instead, by the import-table check in make-installer.ps1 —
      # which refuses to build rather than warn, precisely because this test
      # would go green either way.
      - name: Smoke-test the window
        continue-on-error: true
        run: |
          $p = Start-Process 'C:\sun-notes-test\sun-notes.exe' -PassThru -RedirectStandardOutput C:\out.txt -RedirectStandardError C:\err.txt
          Start-Sleep -Seconds 20
          if (-not $p.HasExited) { $p.Kill() }
          Get-Content C:\out.txt, C:\err.txt -ErrorAction SilentlyContinue
          if (-not (Select-String -Path C:\out.txt -Pattern 'native window handle' -Quiet)) {
            throw "the window handle never appeared on stdout"
          }

  # ----------------------------------------------------------------- release

  release:
    name: Attach to the release
    needs: [build-deb, verify-deb, build-rpm, verify-rpm, build-windows, verify-windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sun-notes-*
          merge-multiple: true
          path: dist

      - name: List what will be uploaded
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.rpm
            dist/*.exe
          fail_on_unmatched_files: true
