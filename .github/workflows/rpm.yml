# Builds the RPM package and publishes it to the GitHub release.
#
# Pushing to the releases branch is what publishes. Nothing else starts this
# workflow: not a push to main, not a pull request, not a tag on its own. The
# commit pushed to releases must carry a tag, and that tag names the release —
# the run fails outright if no tag points at it, rather than publish a version
# number that does not match its contents. Pushing the same tag again replaces
# that release's files.
#
# One of three package workflows, alongside deb.yml and windows.yml. They publish
# independently: each attaches its own file to the release as soon as it is
# ready, so a build broken on one platform no longer holds up the other two.
# The price is that a release can be incomplete with nothing saying so — check
# that all three ran green before announcing a version.
#
# Their release jobs share one concurrency group. A concurrency group is
# repository-wide rather than workflow-scoped, so naming the same group in all
# three serialises them: the first to arrive creates the release, the others
# add their asset to it. Without that they would race to create it and the
# losers would fail with a 422.

name: RPM package

on:
  # Nothing else starts these: pushing to releases is the act of publishing.
  push:
    branches: [releases]

concurrency:
  # Never cancel-in-progress here: every run publishes, and killing one
  # mid-upload would leave the release half-populated.
  group: rpm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolved once, before anything is built. Two reasons for a job of its own:
  # a missing tag then stops the run in seconds instead of after two parallel
  # builds, and outputs from a *matrix* job are whichever leg finished last,
  # which is no way to decide what a release is called.
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the step below needs to know whether a tag
          # points at this exact commit, which a shallow clone cannot answer.
          fetch-depth: 0

      - name: Work out the version from the tag
        id: version
        run: |
          # The release is named after the tag on this very commit — not the
          # nearest reachable one. A release labelled 0.1.0 but built from a
          # commit that is not 0.1.0 cannot be taken back once people have
          # downloaded it, so an inexact match stops the run instead.
          if ! tag="$(git describe --exact-match --tags HEAD 2>/dev/null)"; then
            echo "::error::No tag points at $(git rev-parse --short HEAD). Tag the commit you want to publish and push the tag (git push origin <tag>) before pushing it to releases."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag as version ${tag#v}"

  build-rpm:
    name: Build .rpm (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Nothing cross-compiles — ocamlopt emits code for its host — so an
        # aarch64 package needs a genuine aarch64 machine. GitHub's Linux arm64
        # runners are free for public repositories, which this is.
        include:
          - { runner: ubuntu-latest,    arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    env:
      SWITCH: sun-notes
    container:
      # Not pinned to an older release the way the .deb build is. Fedora's
      # support window is about thirteen months, so its users are on a recent
      # release anyway, and the images for end-of-life releases point at
      # mirrors that have moved to the archive — pinning one would trade a
      # small gain in glibc reach for a build that breaks on its own schedule.
      # Whatever is used here becomes the oldest Fedora the RPM installs on,
      # so pin a number (fedora:43, say) if you ever need to reach further
      # back, and pin the verify job below to the same one.
      #
      # The image is multi-arch, so the arm64 runner pulls the aarch64 variant
      # and builds natively — no emulation.
      image: fedora:latest

    steps:
      # Before the checkout, so that actions/checkout finds a real git and
      # fetches the tags rather than falling back to a tarball download.
      - name: Install the build and packaging tools
        run: |
          # dnf reaches Fedora's mirrors; a blip there would fail a publish.
          # Same retry helper throughout this workflow.
          retry() {
            for i in 1 2 3; do
              "$@" && return 0
              echo "::warning::attempt $i of 3 failed: $*"
              sleep 30
            done
            echo "::error::still failing after 3 attempts: $*"
            return 1
          }

          retry dnf -y install --setopt=install_weak_deps=False \
            git tar gzip findutils diffutils which \
            opam gcc gcc-c++ make patch unzip bzip2 \
            rpm-build rpmlint desktop-file-utils libappstream-glib ImageMagick \
            gtk3-devel webkit2gtk4.1-devel pkgconf-pkg-config

      - uses: actions/checkout@v4

      - name: Let git trust the checkout
        # The container runs as root over files the runner created, which git
        # refuses to touch without this.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache the opam root
        uses: actions/cache@v4
        with:
          path: ~/.opam
          # The architecture belongs in the key: the switch holds a compiler
          # and native objects, and restoring an x86_64 one onto an aarch64
          # runner would be worse than a cold cache.
          key: opam-fedora-${{ matrix.arch }}-${{ hashFiles('dune-project', 'sun-notes.opam') }}
          restore-keys: opam-fedora-${{ matrix.arch }}-

      - name: Set up opam and the OCaml dependencies
        env:
          OPAMROOTISOK: '1'   # the container is root; opam asks to be told so
          OPAMYES: '1'
        run: |
          set -eux
          # Sandboxing uses bubblewrap, which needs privileges a container does
          # not have. The container is the sandbox here.
          #
          # opam fetches from a dozen third-party hosts and only needs one to be
          # slow. It is resumable, so a second attempt picks up where the first
          # stopped rather than starting over.
          retry() {
            for i in 1 2 3; do
              "$@" && return 0
              echo "::warning::attempt $i of 3 failed: $*"
              sleep 30
            done
            echo "::error::still failing after 3 attempts: $*"
            return 1
          }

          if [ ! -d "$HOME/.opam" ]; then
            retry opam init --bare --disable-sandboxing
          fi
          # menhir — and only menhir — is fetched from gitlab.inria.fr, a single
          # institutional server rather than a CDN, and that host times out from
          # GitHub's runners while answering instantly from elsewhere. It is the
          # one host in this dependency tree that is not github.com or
          # erratique.ch, and it is what failed several runs.
          #
          # opam's repository ships an `archive-mirrors: "cache"` pointing at
          # opam.ocaml.org/cache, which holds a byte-identical copy of every
          # archive — but that is a path relative to the repository URL, and CI
          # uses the *git* repository (git+https://github.com/ocaml/
          # opam-repository.git), where it does not resolve. Naming the mirror
          # outright restores it, for every package rather than just menhir.
          opam option --global 'archive-mirrors=["https://opam.ocaml.org/cache"]'
          # A compiler opam builds for itself, not Fedora's ocaml-system.
          # Fedora splits the compiler across several RPMs, and compiler-libs
          # — Toploop, Topdirs, compiler-libs.bytecomp — is one of the pieces
          # left out: against ocaml-system, ocamlfind, stdlib-shims and
          # ocaml-compiler-libs all fail to build for want of exactly those
          # modules. Installing the missing RPM would fix this instance;
          # building the compiler removes the whole class of mismatch, and
          # costs a few minutes only when the cache is cold.
          if ! opam switch list --short | grep -qx "$SWITCH"; then
            retry opam switch create "$SWITCH" ocaml-base-compiler
          fi
          eval "$(opam env --switch="$SWITCH" --set-switch)"
          retry opam install . --deps-only

      - name: Build the package
        env:
          OPAMROOTISOK: '1'
        run: |
          set -eux
          eval "$(opam env --switch="$SWITCH" --set-switch)"
          ./packaging/make-rpm.sh --release --version '${{ needs.version.outputs.version }}'

      - uses: actions/upload-artifact@v4
        with:
          name: sun-notes-rpm-${{ matrix.arch }}
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 14

  verify-rpm:
    name: Install ${{ matrix.arch }} on Fedora
    needs: build-rpm
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    container:
      # Deliberately a clean image: the build container has every -devel
      # package installed, so it would satisfy the runtime requirements by
      # accident. This one only has what the RPM itself asks dnf for.
      image: fedora:latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sun-notes-rpm-${{ matrix.arch }}
          path: dist

      - name: Install it
        run: |
          # desktop-file-utils and libappstream-glib are for the checks below,
          # not dependencies of the package. A mirror blip here would fail a
          # job that gates the release.
          retry() {
            for i in 1 2 3; do
              "$@" && return 0
              echo "::warning::attempt $i of 3 failed: $*"
              sleep 30
            done
            echo "::error::still failing after 3 attempts: $*"
            return 1
          }

          retry dnf -y install findutils desktop-file-utils libappstream-glib
          retry dnf -y install ./dist/sun-notes-*.rpm

      - name: Check what was installed
        run: |
          set -euxo pipefail
          # The package must be the architecture this container actually is.
          # Installing an x86_64 RPM on an aarch64 machine fails with "does not
          # have a compatible architecture" — which is exactly what this matrix
          # exists to catch before a user does.
          test "$(rpm -q --qf '%{ARCH}' sun-notes)" = "${{ matrix.arch }}"
          test "$(uname -m)" = "${{ matrix.arch }}"
          # rpm -V re-checks every installed file against the package's digests.
          rpm -V sun-notes
          command -v sun-notes
          # The launcher is a relative symlink into /usr/libexec. If it
          # resolves to nothing, the app does not start and web_dir () would
          # not find the page either.
          test -x "$(readlink -f /usr/bin/sun-notes)"
          test -f /usr/libexec/sun-notes/web/index.html
          test -f /usr/libexec/sun-notes/web/app.js
          # No OCaml sources should have come along for the ride.
          ! find /usr/libexec/sun-notes/web -name '*.ml' | grep . || exit 1
          desktop-file-validate /usr/share/applications/sun-notes.desktop
          # GNOME Software reads this; if it is malformed the app is invisible
          # there even though it installed correctly.
          appstream-util validate-relax --nonet \
            /usr/share/metainfo/io.github.korkorran.sun-notes.metainfo.xml
          # The automatic dependency generator is the whole reason for using
          # RPM's machinery rather than naming packages by hand, so check it
          # actually produced the webkit requirement.
          rpm -q --requires sun-notes | grep 'libwebkit2gtk-4\.1'
          ldd /usr/libexec/sun-notes/sun-notes
          ! ldd /usr/libexec/sun-notes/sun-notes | grep 'not found'

      # Advisory, for the same reason as on the Debian side.
      - name: Smoke-test the window
        continue-on-error: true
        run: |
          dnf -y install xorg-x11-server-Xvfb dbus-x11
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          out=$(xvfb-run -a dbus-run-session -- timeout 20 sun-notes 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'native window handle'

  # ----------------------------------------------------------------- release

  release:
    name: Attach to the release
    needs: [version, build-rpm, verify-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with the other two package workflows — see the note at the top.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/download-artifact@v4
        with:
          # One artifact per architecture; merge-multiple drops them all into
          # the same directory so the glob below picks up both.
          pattern: sun-notes-rpm-*
          merge-multiple: true
          path: dist

      - name: List what will be uploaded
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          # On a branch push github.ref is refs/heads/releases, which is not a
          # tag, so the action would have nothing to attach to. The tag comes
          # from the version job.
          tag_name: ${{ needs.version.outputs.tag }}
          files: dist/*.rpm
          fail_on_unmatched_files: true
          # Pushing the same tag to releases again replaces that release's files.
          overwrite_files: true
