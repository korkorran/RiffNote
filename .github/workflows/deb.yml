# Builds the Debian package and publishes it to the GitHub release.
#
# The build runs on ubuntu-22.04 on purpose, and the choice is not arbitrary:
# owebview needs webkit2gtk-4.1, which first appears in Debian 12 and Ubuntu
# 22.04, and among those 22.04 is the one with the oldest glibc (2.35). Since
# dpkg-shlibdeps derives the libc6 floor from whatever the binary was linked
# against, building there gives the widest set of distributions the package can
# install on. Building on a newer runner would silently narrow it.
#
# If that runner image is ever retired, the replacement is
# `runs-on: ubuntu-latest` with `container: ubuntu:22.04`, which keeps the same
# glibc floor.
#
# Pushing to the releases branch is what publishes. Nothing else starts this
# workflow: not a push to main, not a pull request, not a tag on its own. The
# commit pushed to releases must carry a tag, and that tag names the release —
# the run fails outright if no tag points at it, rather than publish a version
# number that does not match its contents. Pushing the same tag again replaces
# that release's files.
#
# One of three package workflows, alongside rpm.yml and windows.yml. They publish
# independently: each attaches its own file to the release as soon as it is
# ready, so a build broken on one platform no longer holds up the other two.
# The price is that a release can be incomplete with nothing saying so — check
# that all three ran green before announcing a version.
#
# Their release jobs share one concurrency group. A concurrency group is
# repository-wide rather than workflow-scoped, so naming the same group in all
# three serialises them: the first to arrive creates the release, the others
# add their asset to it. Without that they would race to create it and the
# losers would fail with a 422.

name: Debian package

on:
  # Nothing else starts these: pushing to releases is the act of publishing.
  push:
    branches: [releases]

concurrency:
  # Never cancel-in-progress here: every run publishes, and killing one
  # mid-upload would leave the release half-populated.
  group: deb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Resolved once, before anything is built. Two reasons for a job of its own:
  # a missing tag then stops the run in seconds instead of after two parallel
  # builds, and outputs from a *matrix* job are whichever leg finished last,
  # which is no way to decide what a release is called.
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the step below needs to know whether a tag
          # points at this exact commit, which a shallow clone cannot answer.
          fetch-depth: 0

      - name: Work out the version from the tag
        id: version
        run: |
          # The release is named after the tag on this very commit — not the
          # nearest reachable one. A release labelled 0.1.0 but built from a
          # commit that is not 0.1.0 cannot be taken back once people have
          # downloaded it, so an inexact match stops the run instead.
          if ! tag="$(git describe --exact-match --tags HEAD 2>/dev/null)"; then
            echo "::error::No tag points at $(git rev-parse --short HEAD). Tag the commit you want to publish and push the tag (git push origin <tag>) before pushing it to releases."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag as version ${tag#v}"

  build-deb:
    name: Build .deb (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Both on 22.04 for the same reason the amd64 build was: it is the
        # oldest Ubuntu carrying webkit2gtk-4.1, so dpkg-shlibdeps derives the
        # lowest libc6 floor from it and the package reaches the most machines.
        # Nothing cross-compiles — ocamlopt emits code for its host — so an
        # arm64 package needs a genuine arm64 machine. GitHub's Linux arm64
        # runners are free for public repositories, which this is.
        include:
          - { runner: ubuntu-22.04,     arch: amd64 }
          - { runner: ubuntu-22.04-arm, arch: arm64 }

    steps:
      - uses: actions/checkout@v4

      - name: Install the packaging tools
        run: |
          # apt mirrors are reliable but not infallible, and a blip here would
          # fail a publish. Same retry helper throughout this workflow.
          retry() {
            for i in 1 2 3; do
              "$@" && return 0
              echo "::warning::attempt $i of 3 failed: $*"
              sleep 30
            done
            echo "::error::still failing after 3 attempts: $*"
            return 1
          }

          retry sudo apt-get update
          retry sudo apt-get install -y --no-install-recommends \
            dpkg-dev fakeroot lintian desktop-file-utils imagemagick binutils

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: '5'
          dune-cache: true

      - name: Prefer the opam archive mirror
        run: |
          # menhir — and only menhir — is fetched from gitlab.inria.fr, a single
          # institutional server rather than a CDN, and that host times out from
          # GitHub's runners while answering instantly from elsewhere. It is the
          # one host in this dependency tree that is not github.com or
          # erratique.ch, and it is what failed several runs.
          #
          # opam's repository ships an `archive-mirrors: "cache"` pointing at
          # opam.ocaml.org/cache, which holds a byte-identical copy of every
          # archive — but that is a path relative to the repository URL, and CI
          # uses the *git* repository (git+https://github.com/ocaml/
          # opam-repository.git), where it does not resolve. Naming the mirror
          # outright restores it, for every package rather than just menhir.
          opam option --global 'archive-mirrors=["https://opam.ocaml.org/cache"]'
          opam option --global archive-mirrors

      # opam installs the native dependencies itself: owebview declares
      # libgtk-3-dev and libwebkit2gtk-4.1-dev as depexts for Debian-family
      # systems, and opam 2.1+ acts on them.
      - name: Install the OCaml dependencies
        run: |
          # opam fetches from a dozen third-party hosts and only needs one to be
          # slow. It is resumable, so a second attempt picks up where the first
          # stopped rather than starting over.
          retry() {
            for i in 1 2 3; do
              "$@" && return 0
              echo "::warning::attempt $i of 3 failed: $*"
              sleep 30
            done
            echo "::error::still failing after 3 attempts: $*"
            return 1
          }

          retry opam install . --deps-only --yes

      - name: Build the package
        run: opam exec -- ./packaging/make-deb.sh --release --version '${{ needs.version.outputs.version }}'

      - uses: actions/upload-artifact@v4
        with:
          name: sun-notes-deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

  verify-deb:
    name: Install ${{ matrix.arch }} on ${{ matrix.runner }}
    needs: build-deb
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # Each architecture on both distributions it claims to support. This is
        # what actually proves the Depends are satisfiable there, rather than
        # merely well-formed — and, since the arm64 package is built on a
        # different machine, that it really is an arm64 package.
        include:
          - { runner: ubuntu-22.04,     arch: amd64 }
          - { runner: ubuntu-24.04,     arch: amd64 }
          - { runner: ubuntu-22.04-arm, arch: arm64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sun-notes-deb-${{ matrix.arch }}
          path: dist

      - name: Install it
        run: |
          # A mirror blip here would fail a job that gates the release.
          retry() {
            for i in 1 2 3; do
              "$@" && return 0
              echo "::warning::attempt $i of 3 failed: $*"
              sleep 30
            done
            echo "::error::still failing after 3 attempts: $*"
            return 1
          }

          retry sudo apt-get update
          # desktop-file-utils is for the check below; it is not a dependency
          # of the package, which is why it has to be asked for here.
          retry sudo apt-get install -y desktop-file-utils
          retry sudo apt-get install -y ./dist/sun-notes_*.deb

      - name: Check what was installed
        run: |
          set -euxo pipefail
          # The package must be the architecture this runner actually is —
          # installing an amd64 .deb on an arm64 machine is the failure this
          # matrix exists to prevent.
          test "$(dpkg-query -W -f='${Architecture}' sun-notes)" = "${{ matrix.arch }}"
          test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
          # dpkg -V re-checks every file against the md5sums in the package.
          sudo dpkg -V sun-notes
          command -v sun-notes
          # The launcher is a symlink into /usr/lib; if it resolves to nothing
          # the app does not start at all.
          test -x "$(readlink -f /usr/bin/sun-notes)"
          test -f /usr/lib/sun-notes/web/index.html
          test -f /usr/lib/sun-notes/web/app.js
          # No OCaml sources should have come along for the ride.
          ! find /usr/lib/sun-notes/web -name '*.ml' | grep . || exit 1
          desktop-file-validate /usr/share/applications/sun-notes.desktop
          # Nothing unresolved: this is what a missing or mis-declared
          # dependency would look like at runtime.
          ldd /usr/lib/sun-notes/sun-notes
          ! ldd /usr/lib/sun-notes/sun-notes | grep 'not found'

      # Advisory. Launching WebKitGTK under a virtual display is the one check
      # here that depends on the runner's graphics stack, so a failure is not
      # necessarily the package's fault; the install checks above are the
      # gates. Flip continue-on-error off if it proves reliable.
      - name: Smoke-test the window
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends xvfb dbus-x11
          # The window handle is printed by main.ml *after* Webview.create, so
          # seeing it means GTK and WebKit really did come up. The process then
          # runs its event loop until the timeout kills it, hence exit 124.
          export WEBKIT_DISABLE_COMPOSITING_MODE=1
          export WEBKIT_DISABLE_DMABUF_RENDERER=1
          out=$(xvfb-run -a dbus-run-session -- timeout 20 sun-notes 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q 'native window handle'

  # ----------------------------------------------------------------- release

  release:
    name: Attach to the release
    needs: [version, build-deb, verify-deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with the other two package workflows — see the note at the top.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - uses: actions/download-artifact@v4
        with:
          # One artifact per architecture; merge-multiple drops them all into
          # the same directory so the glob below picks up both.
          pattern: sun-notes-deb-*
          merge-multiple: true
          path: dist

      - name: List what will be uploaded
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          # On a branch push github.ref is refs/heads/releases, which is not a
          # tag, so the action would have nothing to attach to. The tag comes
          # from the version job.
          tag_name: ${{ needs.version.outputs.tag }}
          files: dist/*.deb
          fail_on_unmatched_files: true
          # Pushing the same tag to releases again replaces that release's files.
          overwrite_files: true
